<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Content Studio banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051423"/>
      <stop offset="45%" stop-color="#0a2a4a"/>
      <stop offset="100%" stop-color="#0e3f6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#70b5f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g fill="#0A66C2" opacity="0.08">
    <circle cx="60" cy="40" r="2.2"/><circle cx="100" cy="40" r="2.2"/><circle cx="140" cy="40" r="2.2"/>
    <circle cx="60" cy="70" r="2.2"/><circle cx="100" cy="70" r="2.2"/><circle cx="140" cy="70" r="2.2"/>
  </g>

  <!-- LinkedIn-style post card -->
  <g transform="translate(870,60)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#0a2a4a" stroke="#0A66C2" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#0A66C2"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#70b5f9" stroke-width="1.5"/>
    <line x1="54" y1="24" x2="120" y2="24" stroke="#a8d3ff" stroke-width="3"/>
    <line x1="54" y1="38" x2="100" y2="38" stroke="#70b5f9" stroke-width="2" opacity="0.7"/>
    <line x1="16" y1="60" x2="204" y2="60" stroke="#0A66C2" stroke-width="1.5" opacity="0.5"/>
    <line x1="16" y1="76" x2="204" y2="76" stroke="#0A66C2" stroke-width="1.5" opacity="0.4"/>
    <line x1="16" y1="92" x2="150" y2="92" stroke="#0A66C2" stroke-width="1.5" opacity="0.4"/>
    <!-- like / comment / repost row -->
    <g transform="translate(16,116)" fill="#70b5f9" opacity="0.85">
      <path d="M0,10 a10,10 0 1 1 12,0 l-6,7 z"/>
      <rect x="40" y="2" width="16" height="14" rx="3" fill="none" stroke="#70b5f9" stroke-width="2"/>
      <path d="M90,2 h16 v6 l6,-6 M90,10 h16" fill="none" stroke="#70b5f9" stroke-width="2"/>
    </g>
  </g>

  <!-- creator pen mark -->
  <g transform="translate(1120,45) rotate(35)">
    <rect x="-6" y="0" width="12" height="70" rx="4" fill="#a8d3ff"/>
    <polygon points="-6,70 6,70 0,90" fill="#f8fafc"/>
  </g>

  <text x="150" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    CONTENT STUDIO
  </text>
  <rect x="150" y="164" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="150" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#a8d3ff">
    LinkedIn Posts &#8226; Articles &#8226; Tutorials &#8226; Visual Assets
  </text>
  <text x="150" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#70b5f9">
    Learning in public, one post at a time
  </text>

  <text x="1130" y="295" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#4f7aa6">
    github.com/akxyverse
  </text>
</svg>
